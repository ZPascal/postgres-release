name: E2E

# x86_64: deploys this release through a real BOSH director on the libvirt CPI
#         (QEMU/KVM on the runner) and queries Postgres.
# arm64:  compiles the release's packages natively with their own packaging
#         scripts and queries the resulting Postgres. (No BOSH: there is no
#         ARM64 stemcell and GitHub's ARM runners have no /dev/kvm.)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BOSH_CLI_VERSION: v7.11.2
  # ZPascal/bosh-libvirt-cpi-release PR #32 (adds .github/actions/setup-bosh-director).
  CPI_REF: c89078ded6934ac1a7d026c0a93f051ba1b612f9

jobs:
  x86_64-bosh:
    name: x86_64 BOSH deploy (libvirt CPI, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BOSH_ENVIRONMENT: qemu-ci
      BOSH_CLIENT: admin
      BOSH_CLIENT_SECRET: admin-password
      BOSH_DEPLOYMENT: postgres
      POSTGRES_IP: 192.168.122.21
    steps:
    # The CPI action expects its repository at the workspace root.
    - name: Check out libvirt CPI release
      uses: actions/checkout@v6
      with:
        repository: ZPascal/bosh-libvirt-cpi-release
        ref: ${{ env.CPI_REF }}

    - name: Check out postgres-release
      uses: actions/checkout@v6
      with:
        path: postgres-release

    - name: Set up BOSH director
      uses: ./.github/actions/setup-bosh-director
      with:
        backend: qemu
        bosh_cli_version: ${{ env.BOSH_CLI_VERSION }}

    - name: Update cloud config and upload stemcell
      working-directory: postgres-release
      run: |
        bosh -n update-cloud-config ci/e2e/cloud-config-qemu.yml -v "kernel_path=${KERNEL_PATH}"
        timeout 600 bosh upload-stemcell /tmp/bosh-stemcell.tgz

    - name: Create and upload postgres release
      working-directory: postgres-release
      run: |
        ci/e2e/prepare-yq-blobs.sh
        bosh create-release --force --tarball /tmp/postgres-release.tgz
        # The director's blobstore can come up after its API (same wait as the CPI's e2e).
        for _ in $(seq 1 80); do nc -z "${DIRECTOR_IP}" 25250 && break; sleep 3; done
        nc -z "${DIRECTOR_IP}" 25250 || { echo "blobstore port 25250 never opened"; exit 1; }
        timeout 600 bosh upload-release /tmp/postgres-release.tgz

    - name: Deploy postgres
      working-directory: postgres-release
      run: |
        timeout 7200 bosh -n deploy templates/postgres.yml \
          -o templates/operations/add_static_ips.yml \
          -o templates/operations/set_properties.yml \
          -v "postgres_host_or_ip=${POSTGRES_IP}" \
          --vars-store /tmp/postgres-vars.yml
        bosh instances --ps

    - name: Query postgres
      working-directory: postgres-release
      run: |
        sudo apt-get install -y postgresql-client
        expected_major=$(yq '.postgresql.default' jobs/postgres/templates/used_postgresql_versions.yml)
        PGPASSWORD=$(bosh int /tmp/postgres-vars.yml --path /pgadmin_database_password)
        export PGPASSWORD PGCONNECT_TIMEOUT=10
        q() { psql "host=${POSTGRES_IP} port=5524 user=pgadmin dbname=sandbox" -v ON_ERROR_STOP=1 -Atc "$1"; }

        version=$(q 'SELECT version();')
        echo "$version"
        [[ "$version" == "PostgreSQL ${expected_major}."* ]] || { echo "expected PostgreSQL ${expected_major}.x"; exit 1; }

        icu=$(q "SELECT count(*) FROM pg_collation WHERE collprovider = 'i';")
        echo "ICU collations: ${icu}"
        [ "$icu" -gt 0 ] || { echo "no ICU collations - postgres built without ICU?"; exit 1; }
        [ "$(q "SELECT 'a' < 'B' COLLATE \"de-DE-x-icu\";")" = t ] || { echo "ICU collation comparison failed"; exit 1; }
        echo "postgres query checks passed"

    - name: Collect diagnostics
      if: failure()
      run: |
        mkdir -p /tmp/e2e-diagnostics
        cp /tmp/bosh-create-env.log /tmp/e2e-diagnostics/ 2>/dev/null || true
        bosh tasks --recent=10 --all > /tmp/e2e-diagnostics/tasks.txt 2>&1 || true
        last_failed=$(bosh tasks --recent=10 --all --json 2>/dev/null \
          | yq -p json '[.Tables[0].Rows[] | select(.state != "done")][0].id' 2>/dev/null || true)
        if [ -n "$last_failed" ] && [ "$last_failed" != null ]; then
          bosh task "$last_failed" --debug > /tmp/e2e-diagnostics/task-debug.txt 2>&1 || true
        fi
        bosh logs --dir /tmp/e2e-diagnostics > /dev/null 2>&1 || true
        bash .github/scripts/e2e-debug-qemu.sh deploy > /tmp/e2e-diagnostics/cpi-debug.txt 2>&1 || true

    - name: Upload diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-x86_64-diagnostics
        path: /tmp/e2e-diagnostics
        if-no-files-found: ignore

    - name: Delete deployment
      if: always()
      run: timeout 1200 bosh -n delete-deployment --force || true

    - name: Delete director
      if: always()
      run: |
        sudo bosh delete-env manifests/qemu-cpi.yml \
          -o manifests/ops/qemu-local.yml \
          -o manifests/local-release.yml \
          -o manifests/ops/local-store-dir.yml \
          -o manifests/ops/qemu-mac.yml \
          -o manifests/ops/qemu-kernel-boot.yml \
          -o manifests/ops/qemu-director-ssh.yml \
          --state /tmp/bosh-state.json \
          --vars-store /tmp/bosh-vars.yml \
          -v director_name="${DIRECTOR_NAME}" \
          -v internal_ip="${DIRECTOR_IP}" \
          -v stemcell_url=file:///tmp/bosh-stemcell.tgz \
          -v "kernel_path=${KERNEL_PATH}" \
          -v libvirt_host=192.168.122.1 \
          -v libvirt_username=root \
          --var-file libvirt_private_key=/tmp/bosh-libvirt-ssh-key \
          -v "libvirt_host_key=${LIBVIRT_HOST_KEY}" || true

  arm64-packages:
    name: arm64 packages (PostgreSQL ${{ matrix.major }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        major: [15, 16, 17, 18]
    env:
      PACKAGES_DIR: /tmp/packages
    steps:
    - uses: actions/checkout@v6

    - name: Install build dependencies and BOSH CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libssl-dev libreadline-dev zlib1g-dev bison flex file
        curl -fsSL "https://github.com/cloudfoundry/bosh-cli/releases/download/${BOSH_CLI_VERSION}/bosh-cli-${BOSH_CLI_VERSION#v}-linux-arm64" \
          -o "${RUNNER_TEMP}/bosh"
        sudo install -m 0755 "${RUNNER_TEMP}/bosh" /usr/local/bin/bosh
        bosh --version

    - name: Create release tarball
      run: |
        ci/e2e/prepare-yq-blobs.sh
        bosh create-release --force --tarball /tmp/postgres-release.tgz

    - name: Compile packages
      run: ci/e2e/compile-packages.sh /tmp/postgres-release.tgz postgres-libicu "postgres-${{ matrix.major }}" postgres-yq-4

    - name: Check binaries are aarch64
      run: |
        for b in "${PACKAGES_DIR}/postgres-${{ matrix.major }}/bin/postgres" "${PACKAGES_DIR}/postgres-yq-4/bin/yq"; do
          file -L "$b"
          file -L "$b" | grep -q 'ARM aarch64' || { echo "$b is not an aarch64 binary"; exit 1; }
        done
        "${PACKAGES_DIR}/postgres-yq-4/bin/yq" --version

    - name: Start and query postgres
      run: EXPECT_ARCH=aarch64 ci/e2e/smoke-postgres.sh "${{ matrix.major }}"
